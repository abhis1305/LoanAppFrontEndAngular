<div class="scorecard-container">
  <div class="card shadow result-card">

    <div class="scorecard-header">
      <h2>Loan Score Card</h2>
    </div>

    <div class="scorecard-body">

      <button
        type="button"
        class="btn btn-secondary mb-4"
        (click)="backToList()">
        Back to Customer List
      </button>

      <div
        *ngIf="scorecard?.message"
        class="alert alert-warning mt-3">
        {{ scorecard.message }}
      </div>

      <div *ngIf="loading" class="alert alert-info">
        Generating scorecard...
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
      </div>

      <ng-container *ngIf="scorecard && !loading">

        <div class="table-responsive">
          <table class="table table-bordered">
            <tbody>
              <tr>
                <th>Customer Id</th>
                <td>{{ scorecard.customerId }}</td>
              </tr>

              <tr>
                <th>Risk Category</th>
                <td>{{ scorecard.riskCategory ?? 'N/A' }}</td>
              </tr>

              <tr>
                <th>Eligible Loan Amount</th>
                <td class="eligible-amount">
                  <ng-container
                    *ngIf="
                      scorecard.eligibleLoanAmount != null;
                      else noLoanAmount
                    ">
                    {{
                      scorecard.eligibleLoanAmount
                        | currency:'INR':'symbol':'1.0-2'
                    }}
                  </ng-container>

                  <ng-template #noLoanAmount>
                    Not eligible
                  </ng-template>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

      </ng-container>

    </div>
  </div>
</div>
