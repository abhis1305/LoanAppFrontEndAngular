
<div class="container-fluid mt-4">
  <div class="card shadow-sm p-4">

    <h2>Pending Deals</h2>

    <div class="table-responsive mt-3">
      <table class="table table-bordered table-hover">

        <thead class="table-light">
          <tr>
            <th>Customer Name</th>
            <th>Loan Type</th>
            <th>Loan Amount</th>
            <th>Status</th>
            <th>Applied Date</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let l of loans">
            <td>{{l.customerName}}</td>
            <td>{{l.loanType}}</td>
            <td>{{l.loanAmount | number:'1.2-2'}}</td>
            <td>
              <span class="badge bg-warning text-dark">
                {{l.currentStatus}}
              </span>
            </td>
            <td>{{l.appliedDate | date:'yyyy-MM-dd'}}</td>
            <td>
              <button
                class="btn btn-info btn-sm"
                (click)="ViewProfile(l.dealId)">
                View Profile
              </button>
            </td>
          </tr>

          <tr *ngIf="!loans || loans.length === 0">
            <td colspan="6" class="text-center">
              No pending deals found.
            </td>
          </tr>
        </tbody>

      </table>
    </div>

  </div>
</div>
